[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-mcp-engine"
version = "0.1.0"
description = "An asynchronous, fault-tolerant Agentic Workflow engine designed to process business transactions"
authors = [
    {name = "Agustin Diaz-Cano"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["agents", "mcp", "llm", "eda", "rag", "fastapi", "rabbitmq"]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "mcp",
    "aio-pika",
    # [asyncio] declares greenlet, which the async engine needs: SQLAlchemy 2.1
    # stopped installing it by default. Capped at 2.0 until 2.1 is tested.
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "pgvector",
    "alembic",
    "asyncpg",
    "psycopg2-binary",
    "structlog",
    "python-dotenv",
    "sse-starlette",
    "langsmith",
    # Tracing (src/core/tracing.py). langfuse.langchain's CallbackHandler
    # imports `langchain` itself (only to pick its v1 code path).
    "langfuse>=4.15.4,<5",
    "langchain>=1.4.2,<2",
    "httpx",
    "streamlit",
    "pandas"
]

[project.urls]
Repository = "https://github.com/agustindiazcano/agentic-mcp-engine"
Documentation = "https://github.com/agustindiazcano/agentic-mcp-engine/tree/main/docs"
"Issue Tracker" = "https://github.com/agustindiazcano/agentic-mcp-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "locust",
    # Pinned: ruff/mypy defaults change between releases, and CI must lint
    # and type-check exactly like a local run.
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pandas-stubs"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true

# Optional LLM providers, not declared dependencies: imported inside
# try/except in src/agents/llm_factory.py and absent in CI.
[[tool.mypy.overrides]]
module = ["langchain_openai", "langchain_aws"]
ignore_missing_imports = true
