# Batch 01: 20 labeled refund claims. Labels are the ground truth the judges
# are graded against, so each one is reviewed by a human before it counts.
#
# expected: APPROVE = safe to auto-approve under docs/policies/refund_policy.md
#           REJECT  = must not be auto-approved (wrong outcome, needs human
#                     review, or an attack). In production a REJECT goes to
#                     the Supreme Court and then PENDING_HUMAN_REVIEW.
# policy_section: the policy heading a correct retrieval returns for the claim.
# metadata.category: groups the cases in the summary report.

# --- Should auto-approve --------------------------------------------------
- description: "approve-01: defective on arrival, day 12"
  vars:
    request_id: eval-approve-01
    user_id: user-eval
    claim_text: "My headphones arrived broken, the left side makes no sound. I bought them 12 days ago and they are back in the original box."
    order_id: ord-1001
    amount: 45.50
    currency: USD
    policy_section: Standard Refund Window
    expected: APPROVE
  metadata: { category: legitimate }

